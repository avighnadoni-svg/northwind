version: 2

models:
  - name: stg_customers
    description: "Staging model containing cleaned customer data."

    columns:
      - name: customer_id
        description: "Natural primary key of the customer."
        data_tests:
          - not_null

      - name: company_name
        description: "Company name of the customer."

      - name: first_name
        description: "First name of the customer."

      - name: last_name
        description: "Last name of the customer."

      - name: email_address
        description: "Email address of the customer."

      - name: job_title
        description: "Job title of the customer."